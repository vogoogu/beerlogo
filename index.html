<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Brauatelier – design your own beer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBE9D2; --paper2:#F5DABB; --ink:#2A1A14; --muted:#6E5648;
  --ember:#E8501F; --gold:#F0A91C; --hop:#11704A; --card:#FFF6E8; --line:#2A1A14;
  --display:'Archivo','Arial Narrow',Impact,sans-serif;
  --body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:900;font-stretch:112%;font-size:22px;letter-spacing:-.01em}
.brand svg{width:34px;height:34px}
nav.main{display:flex;align-items:center;gap:clamp(12px,2.4vw,32px)}
nav.main a.link{text-decoration:none;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}
nav.main a.link:hover,nav.main a.link[aria-current="page"]{border-bottom-color:var(--ember)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ember{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:8px 16px;font-size:14px}

/* hero */
.hero{--mega:clamp(34px,9.6vw,150px);padding-top:clamp(24px,4vw,56px);position:relative}
.mega{font-family:var(--display);font-weight:900;font-stretch:118%;text-transform:uppercase;font-size:var(--mega);line-height:.86;letter-spacing:-.025em;text-align:center;margin:0}
.mega span{display:block}
.stage-hero{display:grid;grid-template-columns:1fr minmax(280px,420px) 1fr;gap:24px;align-items:end;margin-top:calc(var(--mega) * -0.72);position:relative;z-index:2}
.hero-can{display:flex;justify-content:center;transform:rotate(-8deg);filter:drop-shadow(0 28px 22px rgba(42,26,20,.28));animation:drop .9s cubic-bezier(.2,.9,.3,1.1) both}
.hero-can svg{height:clamp(320px,48vw,580px);width:auto}
@keyframes drop{from{transform:translateY(-60px) rotate(-22deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.hero-left{padding-bottom:40px;max-width:340px}
.hero-left p{font-size:17px;margin:0 0 20px}
.hero-right{padding-bottom:40px;justify-self:end;width:100%;max-width:340px}
.batch-card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.batch-card h3{margin:0 0 2px;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:22px}
.batch-card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.crates{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:10px 0}
.crates i{aspect-ratio:1;border:1.5px solid var(--line);border-radius:2px;opacity:.35}
.crates i.on{background:var(--ember);border-color:var(--ember);opacity:1}
.crates i.mine{background:var(--hop);border-color:var(--hop);opacity:1}
.batch-card .meta{display:flex;justify-content:space-between;font-size:14px;font-weight:600}

/* sections */
section.block{padding:clamp(56px,8vw,110px) 0;border-top:2px solid var(--line);margin-top:clamp(24px,4vw,60px)}
h2.big{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(34px,5.4vw,76px);line-height:.95;letter-spacing:-.02em;margin:0 0 14px;text-transform:uppercase;max-width:14ch}
.lead{font-size:18px;color:var(--muted);max-width:56ch;margin:0 0 40px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--line);border-radius:18px;overflow:hidden}
.facts div{padding:28px;border-right:2px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(44px,6vw,84px);line-height:1}
.facts span{display:block;margin-top:6px;color:var(--muted)}
.process{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative}
.process::before{content:"";position:absolute;left:8%;right:8%;top:96px;height:14px;background:var(--gold);border-radius:8px;opacity:.55}
.step-tank{position:relative;text-align:left}
.step-tank svg{width:100%;max-width:170px;display:block;margin:0 auto 12px}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-size:14px}
.pill em{font-style:normal;background:var(--gold);color:#2A1A14;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:800}
.step-tank p{margin:10px 0 0;color:var(--muted);font-size:15px}

/* slots */
.page-head{padding:clamp(32px,5vw,64px) 0 28px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.slot{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.slot.sel{outline:5px solid var(--ember);outline-offset:-1px}
.slot h3{margin:0;font-family:var(--display);font-weight:900;font-stretch:112%;font-size:34px;letter-spacing:-.01em}
.slot .note{color:var(--muted);margin:0}
.slot dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:8px 0;font-size:14px}
.slot dt{color:var(--muted)}
.slot dd{margin:0;font-weight:600}
.slot .btn{margin-top:auto}
.togo{font-weight:700;color:var(--ember);font-size:14px}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,520px);gap:clamp(20px,4vw,56px);padding:clamp(24px,4vw,48px) 0 80px;align-items:start}
.steps{list-style:none;margin:0 0 24px;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.steps button{border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.steps button[aria-current="step"]{background:var(--ink);color:var(--paper)}
.panel h2{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(30px,4vw,52px);line-height:1;margin:0 0 8px;letter-spacing:-.02em}
.panel .lead{font-size:16px;margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 16px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%}
.opt[aria-pressed="true"]{outline:4px solid var(--ember);outline-offset:-1px}
.opt b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:20px}
.opt small{color:var(--muted);font-size:14px}
.opt .r{grid-row:1 / span 2;grid-column:2;text-align:right;font-weight:600;font-size:14px;align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 28px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{display:block;margin-bottom:20px}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.field input[type=text]{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--line),0 0 0 6px var(--ember)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-bottom:12px}
.icons button{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer;display:grid;place-items:center;padding:8px}
.icons button[aria-pressed="true"]{outline:4px solid var(--ember);outline-offset:-1px}
.icons svg{width:100%;height:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.api-note{font-size:14px;color:var(--muted);margin:6px 0 24px}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:44px;height:44px;background:transparent;border:0;font-size:22px;cursor:pointer}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:18px}
.check{display:flex;gap:12px;align-items:flex-start;margin:22px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ember);margin-top:2px}
.nav-row{display:flex;justify-content:space-between;margin-top:32px;gap:12px}
.summary{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px}
.summary table{width:100%;border-collapse:collapse}
.summary td{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 25%,transparent)}
.summary td:last-child{text-align:right;font-weight:600}
.summary tr.total td{border-bottom:0;font-size:22px;font-weight:800;padding-top:14px}
.terms{font-size:14px;color:var(--muted);margin:14px 0 20px}
.aside{position:sticky;top:16px}
.stage{position:relative;aspect-ratio:1/1.12;display:grid;place-items:center;background:var(--paper2);border:2px solid var(--line);border-radius:28px;overflow:hidden}
.stage::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:var(--gold);opacity:.55}
.stage svg.can,.stage svg.bottle{position:relative;height:92%;width:auto;filter:drop-shadow(0 22px 18px rgba(42,26,20,.3));transition:transform .4s}
.stage svg.can{transform:rotate(-6deg)}
.hero-can{height:clamp(340px,48vw,580px)}
.hero-can canvas,.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;outline-offset:-4px}
.stage canvas{position:absolute;inset:0;filter:drop-shadow(0 22px 18px rgba(42,26,20,.3))}

.stage-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 18px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ok{text-align:center;padding:30px 0}
.ok h2{margin-bottom:12px}
.ok .code{display:inline-block;border:2px dashed var(--line);border-radius:12px;padding:8px 18px;font-weight:700;font-size:20px;margin:12px 0 24px}

footer{border-top:2px solid var(--line);padding:32px 0 48px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .stage-stack,.studio{grid-template-columns:1fr}
  .stage-hero{grid-template-columns:1fr;margin-top:calc(var(--mega) * -0.8)}
  .hero-left,.hero-right{max-width:none;justify-self:stretch;padding-bottom:0}
  .hero-left{order:2}.hero-right{order:3}
  .facts{grid-template-columns:1fr}.facts div{border-right:0;border-bottom:2px solid var(--line)}.facts div:last-child{border-bottom:0}
  .process{grid-template-columns:1fr 1fr}.process::before{display:none}
  .aside{position:static;order:-1}
  .stage{aspect-ratio:auto;height:min(340px,62vw)}
  .stage::before{width:auto;height:88%}
  nav.main a.link.hide-sm{display:none}
}
@media (max-width:520px){
  .process{grid-template-columns:1fr}
  header.top{flex-wrap:wrap;gap:10px}
  .brand{font-size:19px}
  nav.main{width:100%;justify-content:space-between;gap:12px}
  .btn{padding:11px 18px}
  .nav-row .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  .hero-can{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#home" aria-label="Brauatelier home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#2A1A14"/><path d="M20 7l3.4 7.6 8.2.9-6.1 5.5 1.7 8.1L20 24.8 12.8 29.1l1.7-8.1-6.1-5.5 8.2-.9z" fill="#F0A91C"/></svg>
      Brauatelier
    </a>
    <nav class="main" aria-label="Main">
      <a class="link hide-sm" href="#how" data-r="how">How it works</a>
      <a class="link" href="#slots" data-r="slots">Book a slot</a>
      <a class="btn ember sm" href="#studio" data-r="studio">Design your beer</a>
    </nav>
  </header>
  <main id="main"></main>
  <footer>
    <span>Brauatelier – prototype UI. Prices, dates and batches are placeholders.</span>
    <span>Batch not full within six weeks? Every crate is refunded in full.</span>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/three.min.js"></script>
<script>
/* ---------- data ---------- */
const STYLES=[
 {id:'helles',name:'Helles',abv:4.9,note:'Soft, bready and easy to drink',brew:'Sat 9 Jan',by:'4 Jan',filled:22},
 {id:'pale',name:'Pale Ale',abv:5.2,note:'Citrus hops over a light malt body',brew:'Sat 16 Jan',by:'11 Jan',filled:31},
 {id:'ipa',name:'IPA',abv:6.1,note:'Resinous, bitter and tropical',brew:'Sat 23 Jan',by:'18 Jan',filled:12},
 {id:'weizen',name:'Weizen',abv:5.3,note:'Banana, clove and soft wheat',brew:'Sat 30 Jan',by:'25 Jan',filled:6},
 {id:'dunkel',name:'Dunkel',abv:5.0,note:'Toasted bread, caramel and cocoa',brew:'Sat 6 Feb',by:'1 Feb',filled:3}
];
const TWISTS=['None','Citrus peel','Elderflower','Smoked malt','Cold coffee'];
const PAL={
 ember:{bg:'#E8501F',ink:'#FFF1DC',acc:'#2A1A14',name:'Ember'},
 hop:{bg:'#11704A',ink:'#FFF1DC',acc:'#F0A91C',name:'Hop green'},
 night:{bg:'#2A1A14',ink:'#F0A91C',acc:'#FBE9D2',name:'Night'},
 gold:{bg:'#F0A91C',ink:'#2A1A14',acc:'#E8501F',name:'Gold'},
 cream:{bg:'#FBE9D2',ink:'#2A1A14',acc:'#E8501F',name:'Cream'},
 sky:{bg:'#3E7CB1',ink:'#FFF1DC',acc:'#F0A91C',name:'Alpine blue'}
};
const PATTERNS=[['none','Plain'],['stripes','Stripes'],['dots','Dots'],['band','Band']];
const ICONKEYS=['hop','wheat','star','peak','sun'];
const PRICE={can:68,bottle:72};
const FORMATS={can:'24 cans · 0.33 l',bottle:'20 bottles · 0.5 l'};
const S={style:'ipa',twist:'Citrus peel',name:'Hopfenfuchs',tagline:'Gebraut für Freunde',palette:'ember',pattern:'stripes',
 logo:{kind:'icon',key:'hop',data:null},art:null,format:'can',qty:1,open:false,step:0,reserved:null};
const sty=id=>STYLES.find(x=>x.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
let uidc=0;
let V=null;

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800);}

/* ---------- artwork ---------- */
function icon(key,ink,bg){
  const i={
   hop:`<path d="M0-16C10-14 14-4 10 6 7 13 3 17 0 18-3 17-7 13-10 6-14-4-10-14 0-16Z" fill="${ink}"/><path d="M-9-2Q0 4 9-2M-7 6Q0 11 7 6M0-16V18" stroke="${bg}" fill="none" stroke-width="1.7"/>`,
   wheat:`<path d="M0 18V-14" stroke="${ink}" stroke-width="2"/>${[-10,-2,6].map(y=>`<ellipse cx="-6" cy="${y}" rx="4" ry="7" transform="rotate(-30 -6 ${y})" fill="${ink}"/><ellipse cx="6" cy="${y}" rx="4" ry="7" transform="rotate(30 6 ${y})" fill="${ink}"/>`).join('')}<ellipse cx="0" cy="-15" rx="3.5" ry="6" fill="${ink}"/>`,
   star:`<polygon points="0,-17 5,-5 18,-5 8,3 12,16 0,8 -12,16 -8,3 -18,-5 -5,-5" fill="${ink}"/>`,
   peak:`<polygon points="-19,15 -5,-10 3,2 9,-6 19,15" fill="${ink}"/><polygon points="-5,-10 -1,-3 -9,-3" fill="${bg}"/>`,
   sun:`<circle r="8" fill="${ink}"/>${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-1.6" y="-17" width="3.2" height="7" rx="1.6" transform="rotate(${a})" fill="${ink}"/>`).join('')}`
  };
  return i[key]||'';
}
function nameLines(n){
  n=(n||'').trim()||'Your beer';
  const w=n.split(/\s+/);
  if(w.length>1&&n.length>9){const m=Math.ceil(w.length/2);return[w.slice(0,m).join(' '),w.slice(m).join(' ')];}
  return[n];
}
function logoMark(s,cx,cy,r,P,u){
  let inner;
  if((s.logo.kind==='upload'||s.logo.kind==='mask')&&s.logo.data){
    inner=`<clipPath id="lg${u}"><circle cx="${cx}" cy="${cy}" r="${r-3}"/></clipPath><image href="${s.logo.data}" x="${cx-r+3}" y="${cy-r+3}" width="${(r-3)*2}" height="${(r-3)*2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#lg${u})"/>`;
  }else{
    inner=`<g transform="translate(${cx} ${cy}) scale(${r/24})">${icon(s.logo.key,P.ink,P.bg)}</g>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${P.ink}" stroke-width="2.2"/>${inner}`;
}
function patternDefs(s,P,u){
  if(s.pattern==='stripes')return `<pattern id="pt${u}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="6" height="14" fill="${P.acc}" opacity=".3"/></pattern>`;
  if(s.pattern==='dots')return `<pattern id="pt${u}" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2.6" fill="${P.acc}" opacity=".35"/></pattern>`;
  return '';
}
function patternFill(s,P,u,y,h){
  if(s.pattern==='stripes'||s.pattern==='dots')return `<rect x="0" y="0" width="200" height="400" fill="url(#pt${u})"/>`;
  if(s.pattern==='band')return `<rect x="0" y="${y}" width="200" height="${h}" fill="${P.acc}" opacity=".25"/>`;
  return '';
}
function canSVG(s){
  const u=++uidc,P=PAL[s.palette],st=sty(s.style),L=nameLines(s.name);
  const fs=L.length>1?26:32,y0=L.length>1?214:228;
  const sil='M58 40H142C150 48 162 56 164 76V324C164 338 156 346 148 352Q100 364 52 352C44 346 36 338 36 324V76C38 56 50 48 58 40Z';
  const print='M30 80Q100 92 170 80V332Q100 344 30 332Z';
  const nm=L.map((t,i)=>`<text x="100" y="${y0+i*fs*.95}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${P.ink}" textLength="${Math.min(100,Math.max(40,t.length*fs*.6))}" lengthAdjust="spacingAndGlyphs" style="font-family:Archivo,Impact,sans-serif">${esc(t.toUpperCase())}</text>`).join('');
  const tagY=y0+(L.length-1)*fs*.95+22;
  const tag=s.tagline.trim()?`<text x="100" y="${tagY}" text-anchor="middle" font-size="9.5" fill="${P.ink}" textLength="${Math.min(98,s.tagline.trim().length*5.2)}" lengthAdjust="spacingAndGlyphs" style="font-family:'Work Sans',sans-serif">${esc(s.tagline.trim())}</text>`:'';
  return `<svg class="can" viewBox="0 0 200 392" role="img" aria-label="Beer can: ${esc(s.name)}, ${st.name}">

  const scene=new T.Scene(),cam=new T.PerspectiveCamera(28,1,.1,100);
  {
    const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');

    x.fillStyle=g;x.fillRect(0,0,512,256);x.fillStyle='#fff';
    [[40,60,110,70],[300,50,120,80],[190,40,40,100],[440,90,50,60]].forEach(r=>x.fillRect(r[0],r[1],r[2],r[3]));
    const et=new T.CanvasTexture(c);et.mapping=T.EquirectangularReflectionMapping;et.encoding=T.sRGBEncoding;
    const pm=new T.PMREMGenerator(R);scene.environment=pm.fromEquirectangular(et).texture;et.dispose();pm.dispose();
  }

  const key=new T.DirectionalLight(0xfff1dc,1.5);key.position.set(-3,4,5);scene.add(key);
  const rim=new T.DirectionalLight(0xffc88a,1.1);rim.position.set(4,2,-4);scene.add(rim);
  const pivot=new T.Group(),canG=new T.Group(),botG=new T.Group();pivot.add(canG,botG);scene.add(pivot);
  const C=h=>new T.Color(h).convertSRGBToLinear();
  const lathe=a=>new T.LatheGeometry(a.map(p=>new T.Vector2(p[0],p[1])),96);
  const cvs={can:document.createElement('canvas'),bottle:document.createElement('canvas')};
  const texs={};

  /* can */
  const metal=new T.MeshStandardMaterial({color:C(0xc9ced4),metalness:1,roughness:.3,envMapIntensity:.95,side:T.DoubleSide});
  canG.add(new T.Mesh(lathe([[0,.2],[.6,.2],[.66,.05],[.72,0],[.8,.03],[.86,.12],[.94,.24],[1,.36],[1,4],[.99,4.1],[.93,4.24],[.84,4.38],[.78,4.48],[.76,4.54],[.77,4.6],[.82,4.64],[.82,4.69],[.75,4.69],[.7,4.62],[.66,4.56],[0,4.56]]),metal));
  const canMat=new T.MeshPhysicalMaterial({map:texs.can,metalness:.35,roughness:.38,clearcoat:.5,clearcoatRoughness:.25,envMapIntensity:.9});
  const pm1=new T.Mesh(new T.CylinderGeometry(1.006,1.006,3.64,128,1,true),canMat);pm1.position.y=2.18;pm1.rotation.y=Math.PI;canG.add(pm1);
  const tab=new T.Mesh(new T.BoxGeometry(.55,.035,.24),metal);tab.position.set(.12,4.6,0);canG.add(tab);
  const hole=new T.Mesh(new T.CylinderGeometry(.3,.3,.01,32),new T.MeshStandardMaterial({color:C(0x3a3f45),roughness:.6}));hole.scale.z=.55;hole.position.set(-.26,4.566,0);canG.add(hole);
  canG.position.y=-2.37;
  /* bottle */
  const glass=new T.MeshPhysicalMaterial({color:C(0x3a1a04),metalness:0,roughness:.06,clearcoat:1,clearcoatRoughness:.04,transparent:true,opacity:.93,envMapIntensity:.9,side:T.DoubleSide});
  const liquid=new T.MeshStandardMaterial({color:C(0x5e2c05),emissive:C(0x2a1000),emissiveIntensity:.2,roughness:.5});
  botG.add(new T.Mesh(lathe([[0,.12],[.55,.12],[.7,.12],[.78,.2],[.79,.3],[.79,2.55],[.77,2.85],[.69,3.2],[.52,3.55],[.34,3.85],[.25,4.1],[.22,4.35],[.22,4.6],[0,4.6]]),liquid));
  const gl=new T.Mesh(lathe([[0,.06],[.56,.06],[.7,0],[.8,.1],[.82,.3],[.82,2.55],[.8,2.85],[.72,3.2],[.55,3.55],[.37,3.85],[.28,4.1],[.25,4.35],[.25,4.95],[.28,5],[.32,5.07],[.32,5.18],[.27,5.22]]),glass);gl.renderOrder=2;botG.add(gl);
  const bMat=new T.MeshStandardMaterial({map:texs.bottle,roughness:.55,metalness:0,envMapIntensity:.5});
  const lb=new T.Mesh(new T.CylinderGeometry(.827,.827,1.9,128,1,true),bMat);lb.position.y=1.5;lb.rotation.y=Math.PI;botG.add(lb);
  const capMat=new T.MeshStandardMaterial({color:C(0xe8501f),metalness:.6,roughness:.35,flatShading:true,envMapIntensity:1.2});
  const cap=new T.Mesh(new T.CylinderGeometry(.33,.36,.16,28,1),capMat);cap.position.y=5.25;botG.add(cap);
  botG.position.y=-2.68;

  let kind='can',dirty=true,raf=0,ry=0,tx=.14,intro=false,drag=false,lx=0,ly=0;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){ry=.9;intro=true;}
  const dims={can:[4.75,2.05],bottle:[5.35,1.7]};
  function frame(){
    const d=dims[kind],t=Math.tan(28*Math.PI/360),asp=cam.aspect||1;

  cv.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.012;tx=Math.max(-.1,Math.min(.5,tx+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY;dirty=true;});

  return {update,dispose(){cancelAnimationFrame(raf);ro.disconnect();Object.values(texs).forEach(x=>x.dispose());R.dispose();cv.remove();}};
}

/* ---------- generator API (server-side proxy, see functions/api/generate.js) ---------- */
function toMask(src){
  return new Promise((ok,no)=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
      x.drawImage(im,0,0,512,512);
      const d=x.getImageData(0,0,512,512),p=d.data;
      for(let i=0;i<p.length;i+=4){
        const l=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255;
        const a=Math.max(0,Math.min(1,(0.85-l)/0.6));
        p[i]=p[i+1]=p[i+2]=0;p[i+3]=Math.round(a*255);
      }
      x.putImageData(d,0,0);ok(c.toDataURL('image/png'));
    };
    im.onerror=no;im.src=src;
  });
}
async function generate(type,btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent='Generating…';
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,style:S.style,twist:S.twist,palette:S.palette})});
    const d=await r.json().catch(()=>({}));
    if(r.status===501||d.error==='not_configured')toast('Generator not connected yet. Upload an image or pick an icon.');
    else if(!r.ok||!d.image)toast('Generation failed. Please try again.');
    else{
      if(type==='logo')S.logo={kind:'mask',key:null,data:await toMask(d.image)};else S.art=d.image;
      panel();preview();toast(type==='logo'?'Logo added.':'Label art added.');
    }
  }catch(e){toast('Could not reach the generator. Check your connection.');}
  btn.disabled=false;btn.textContent=old;
}

/* ---------- router ---------- */
function route(){
  if(V){V.dispose();V=null;}
  const r=(location.hash||'#home').slice(1);
  document.querySelectorAll('nav.main a.link').forEach(a=>a.removeAttribute('aria-current'));
  const link=document.querySelector(`nav.main a[data-r="${r}"]`);if(link&&r!=='studio')link.setAttribute('aria-current','page');
  if(r==='slots')slots();
  else if(r==='studio')studio();
  else{home();{const hc=$('#heroCan');V=mount3D(hc,()=>S,'can');if(!V)hc.innerHTML=canSVG(S);}if(r==='how')setTimeout(()=>$('#how-sec')&&$('#how-sec').scrollIntoView({behavior:'smooth'}),30);else window.scrollTo(0,0);}
  if(r!=='how')window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
