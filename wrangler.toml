# NOTE: `name` must match the project name shown in your Cloudflare dashboard.
name = "brauatelier"
main = "worker.js"
compatibility_date = "2024-11-01"

# Bundle index.html and three.min.txt into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

# Cloudflare Workers AI (FLUX image model). No API key needed.
[ai]
binding = "AI"
